# Render blueprint for the Synapse backend + managed PostgreSQL.
#
# Secrets are never stored in this file:
#   * SECRET_KEY is generated by Render on first deploy.
#   * DATABASE_URL is injected from the managed database below.
#   * FRONTEND_URL / ALLOWED_ORIGINS are marked `sync: false`, so you set them
#     in the Render dashboard once the Vercel domain exists.

databases:
  - name: synapse-db
    databaseName: synapse
    user: synapse
    plan: free          # Render's free PostgreSQL expires 30 days after creation.
    region: oregon

services:
  - type: web
    name: synapse-backend
    runtime: python
    plan: free
    region: oregon
    branch: main
    buildCommand: pip install --upgrade pip && pip install -r backend/requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      # LOAD-BEARING. Render's default for newly created services is now
      # 3.14.x, and pydantic-core and psycopg-binary publish no cp314 wheels
      # yet - the build would fall back to a source compile and fail.
      # 3.13.5 is the version the test suite is verified against.
      - key: PYTHON_VERSION
        value: "3.13.5"
      - key: ENVIRONMENT
        value: production
      # Generated once by Render and kept across deploys. Rotating it signs
      # every user out, because all issued tokens stop verifying.
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: synapse-db
          property: connectionString
      # Applies Alembic migrations during application startup.
      - key: RUN_MIGRATIONS_ON_STARTUP
        value: "true"
      - key: AUTO_CREATE_TABLES
        value: "false"
      # Cross-site cookies: the Vercel frontend and this API are on
      # different registrable domains.
      - key: COOKIE_SAMESITE
        value: none
      - key: COOKIE_SECURE
        value: "true"
      - key: ENABLE_DOCS
        value: "false"
      # Set these in the dashboard to your real Vercel domain, e.g.
      #   FRONTEND_URL=https://synapse.vercel.app
      #   ALLOWED_ORIGINS=https://synapse.vercel.app,https://synapse-git-main-you.vercel.app
      - key: FRONTEND_URL
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
