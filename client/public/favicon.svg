<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <linearGradient id="chip" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7B8CFF"/>
      <stop offset="1" stop-color="#5C6CE8"/>
    </linearGradient>
  </defs>
  <rect width="32" height="32" rx="8" fill="url(#chip)"/>
  <g transform="translate(4 4) scale(1)" fill="none">
    <!-- presynaptic terminal -->
    <circle cx="8.8" cy="23.2" r="4.1" fill="#fff"/>
    <!-- signal crossing the cleft -->
    <circle cx="14.1" cy="17.9" r="1.7" fill="#fff"/>
    <circle cx="17.9" cy="14.1" r="1.65" fill="#fff" opacity="0.72"/>
    <!-- postsynaptic receptor -->
    <circle cx="23.2" cy="8.8" r="4.1" stroke="#fff" stroke-width="2.8"/>
  </g>
</svg>
